<!-- login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - Juega Virtual Argentina</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-auth">
  <main class="login-container">
    <h1>Juega Virtual Argentina</h1>
    <h2>Iniciar Sesión</h2>
    <p id="registro-confirmado" class="auth-notice" role="status" aria-live="polite" hidden></p>
    <a id="whatsapp-registro" class="auth-whatsapp-link" hidden target="_blank"
      rel="noopener noreferrer">Abrir WhatsApp para avisar del registro</a>
    <form id="login-form">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" id="usuario" name="username" minlength="3" maxlength="24"
        pattern="[A-Za-z0-9_]+" autocomplete="username" required />
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="password" autocomplete="current-password" required />
      <button type="submit">Ingresar</button>
      <p id="error" class="error"></p>
      <a id="whatsapp-verification" hidden target="_blank" rel="noopener noreferrer">
        Verificar mi cuenta por WhatsApp
      </a>
    </form>
    <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
  </main>

  <script type="module">
    import { getOrganizerWhatsAppLink, login } from './js/auth.js';

    const form = document.getElementById('login-form');
    const errorDisplay = document.getElementById('error');
    const params = new URLSearchParams(window.location.search);
    const registeredUsername = params.get('usuario');
    if (params.get('registro') === 'ok') {
      if (registeredUsername) {
        document.getElementById('usuario').value = registeredUsername;
      }
      const confirmation = document.getElementById('registro-confirmado');
      const whatsappStatus = params.get('whatsapp');
      const sessionStatus = params.get('sesion');
      confirmation.textContent = sessionStatus === 'error'
        ? 'Cuenta creada. Se abrió WhatsApp en otra pestaña; envía el aviso. Recarga esta página e inicia sesión con tu usuario y contraseña.'
        : whatsappStatus === 'bloqueado'
        ? 'Cuenta creada. El navegador bloqueó la apertura automática de WhatsApp. Abre el aviso con el botón y, al terminar, inicia sesión aquí.'
        : whatsappStatus === 'error'
          ? 'Cuenta creada, pero no se pudo preparar el aviso de WhatsApp. Contacta al organizador y luego inicia sesión aquí.'
          : 'Cuenta creada. Se abrió WhatsApp en otra pestaña; envía el aviso y vuelve aquí para iniciar sesión.';
      confirmation.hidden = false;

      if (whatsappStatus === 'bloqueado' && registeredUsername) {
        getOrganizerWhatsAppLink(
          `Me registre en Juega Virtual Argentina. Mi nombre de usuario es ${registeredUsername}.`
        ).then((link) => {
          const whatsappLink = document.getElementById('whatsapp-registro');
          whatsappLink.href = link;
          whatsappLink.hidden = false;
        }).catch((linkError) => {
          console.error('[login] No se pudo preparar el enlace de WhatsApp:', linkError);
          confirmation.textContent =
            'Cuenta creada, pero no se pudo preparar WhatsApp. Contacta al organizador y luego inicia sesión aquí.';
        });
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      const { error } = await login(usuario, contrasena);
      if (error) {
        const verificationRequired = error.message?.includes('JVA_VERIFICATION_REQUIRED');
        const accountBlocked = error.message?.includes('JVA_ACCOUNT_BLOCKED');
        const invalidUsername = error.message?.startsWith('El nombre');
        errorDisplay.textContent = verificationRequired
          ? 'Debes confirmar tu cuenta por WhatsApp para seguir jugando.'
          : accountBlocked
            ? 'Tu cuenta fue bloqueada por administración. Contacta al organizador.'
          : invalidUsername
            ? error.message
            : 'No se pudo iniciar sesión. Revisa tu nombre de usuario y contraseña.';

        const verificationLink = document.getElementById('whatsapp-verification');
        verificationLink.hidden = !verificationRequired;
        if (verificationRequired) {
          try {
            verificationLink.href = await getOrganizerWhatsAppLink(
              `Necesito confirmar mi cuenta de Juega Virtual Argentina. Mi nombre de usuario es ${usuario}.`
            );
          } catch (linkError) {
            console.error('[login] No se pudo generar el enlace de WhatsApp:', linkError);
            verificationLink.hidden = true;
            errorDisplay.textContent += ' No se pudo preparar el enlace; informa al organizador.';
          }
        }
      } else {
        window.location.href = 'lobby.html';
      }
    });
  </script>
</body>
</html>
