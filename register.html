<!-- register.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Juega Virtual Argentina</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-auth">
  <main class="login-container">
    <h1>Juega Virtual Argentina</h1>
    <h2>Registro de Usuario</h2>
    <form id="register-form">
      <label for="nombre_usuario">Nombre de usuario</label>
      <input type="text" id="nombre_usuario" name="username" minlength="3" maxlength="24"
        pattern="[A-Za-z0-9_]+" autocomplete="username" required />
      <label for="telefono">WhatsApp de contacto en formato internacional</label>
      <input type="tel" id="telefono" name="phone" placeholder="+5491157054802"
        autocomplete="tel" required />
      <small>Se guarda para que el equipo pueda contactarte; no se usa para iniciar sesión.</small>
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="password" minlength="8"
        autocomplete="new-password" required />
      <button type="submit">Registrarse</button>
      <p id="error" class="error"></p>
    </form>
    <p id="registro-confirmado" role="status" hidden></p>
    <a id="whatsapp-registro" hidden target="_blank" rel="noopener noreferrer">
      Avisar por WhatsApp (opcional)
    </a>
    <a id="continuar-lobby" href="lobby.html" hidden>Continuar a Juega Virtual Argentina</a>
    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
  </main>

  <script type="module">    
    import { getOrganizerWhatsAppLink, register as registrar } from './js/auth.js';


    const form = document.getElementById('register-form');
    const errorDisplay = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;
      const telefono = document.getElementById('telefono').value.trim();
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;

      try {
        const { data, error } = await registrar(nombre_usuario, contrasena, telefono);
        if (error || !data?.user) {
          errorDisplay.textContent = error?.message || 'No se pudo confirmar la creación de la cuenta.';
          return;
        }

        form.hidden = true;
        document.getElementById('registro-confirmado').textContent =
          'Cuenta creada. El aviso por WhatsApp es opcional y no se envía automáticamente.';
        document.getElementById('registro-confirmado').hidden = false;
        document.getElementById('continuar-lobby').hidden = !data.session;

        try {
          const link = await getOrganizerWhatsAppLink(
            `Me registre en Juega Virtual Argentina. Mi nombre de usuario es ${nombre_usuario}.`
          );
          const whatsappLink = document.getElementById('whatsapp-registro');
          whatsappLink.href = link;
          whatsappLink.hidden = false;
        } catch (linkError) {
          console.error('[register] No se pudo generar el enlace de WhatsApp:', linkError);
          errorDisplay.textContent =
            'La cuenta se creó, pero no se pudo preparar el enlace de WhatsApp. Puedes avisar al organizador manualmente.';
        }
      } catch (error) {
        console.error('[register] Error inesperado al crear la cuenta:', error);
        errorDisplay.textContent = 'No se pudo completar el registro. Inténtalo nuevamente.';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
