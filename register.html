<!-- register.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Juega Virtual Argentina</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-auth">
  <main class="login-container">
    <h1>Juega Virtual Argentina</h1>
    <h2>Registro de Usuario</h2>
    <form id="register-form">
      <label for="nombre_usuario">Nombre de usuario</label>
      <input type="text" id="nombre_usuario" name="username" minlength="3" maxlength="24"
        pattern="[A-Za-z0-9_]+" autocomplete="username" required />
      <label for="telefono">WhatsApp de contacto en formato internacional</label>
      <input type="tel" id="telefono" name="phone" placeholder="+5491157054802"
        autocomplete="tel" required />
      <small>Se guarda como contacto y se usará para preparar el aviso de registro por WhatsApp. No se usa para iniciar sesión.</small>
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="password" minlength="8"
        autocomplete="new-password" required />
      <button type="submit">Registrarse</button>
      <p id="error" class="error"></p>
    </form>
    <p id="registro-confirmado" role="status" aria-live="polite" hidden></p>
    <a id="whatsapp-registro" hidden target="_blank" rel="noopener noreferrer">
      Abrir WhatsApp para avisar del registro
    </a>
    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
  </main>

  <script type="module">    
    import {
      getOrganizerWhatsAppLink,
      register as registrar,
      signOutLocalSession,
    } from './js/auth.js';

    const form = document.getElementById('register-form');
    const errorDisplay = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;
      const telefono = document.getElementById('telefono').value.trim();
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      errorDisplay.textContent = '';
      const whatsappWindow = window.open('about:blank', '_blank');

      try {
        let whatsappLink;
        try {
          whatsappLink = await getOrganizerWhatsAppLink(
            `Me registre en Juega Virtual Argentina. Mi nombre de usuario es ${nombre_usuario}.`
          );
        } catch (linkError) {
          console.error('[register] No se pudo preparar el aviso de WhatsApp:', linkError);
          whatsappWindow?.close();
          errorDisplay.textContent =
            'No se pudo preparar el aviso de WhatsApp. No se creó la cuenta; inténtalo más tarde o contacta al organizador.';
          return;
        }

        const { data, error } = await registrar(nombre_usuario, contrasena, telefono);
        if (error || !data?.user) {
          whatsappWindow?.close();
          errorDisplay.textContent = error?.message || 'No se pudo confirmar la creación de la cuenta.';
          return;
        }

        let sessionCloseFailed = false;
        if (data.session) {
          try {
            await signOutLocalSession();
          } catch (signOutError) {
            console.error('[register] La cuenta se creó, pero no se pudo cerrar la sesión automática:', signOutError);
            sessionCloseFailed = true;
          }
        }

        if (whatsappLink && whatsappWindow) {
          whatsappWindow.location.replace(whatsappLink);
        } else {
          whatsappWindow?.close();
        }

        const loginUrl = new URL('login.html', window.location.href);
        loginUrl.searchParams.set('registro', 'ok');
        loginUrl.searchParams.set('usuario', nombre_usuario);
        if (sessionCloseFailed) {
          loginUrl.searchParams.set('sesion', 'error');
        }
        if (!whatsappLink) {
          loginUrl.searchParams.set('whatsapp', 'error');
        } else if (!whatsappWindow) {
          loginUrl.searchParams.set('whatsapp', 'bloqueado');
        }
        window.location.replace(loginUrl);
      } catch (error) {
        console.error('[register] Error inesperado al crear la cuenta:', error);
        errorDisplay.textContent = 'No se pudo completar el registro. Inténtalo nuevamente.';
        whatsappWindow?.close();
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
