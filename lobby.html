<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby - Juega Virtual Argentina</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-lobby">
  <main class="container lobby-panel">
    <header>
      <h1>Juega Virtual Argentina <span aria-hidden="true">♠</span></h1>
      <p id="user-info">Cargando cuenta...</p>
      <a id="admin-link" href="administracion.html" hidden>Panel de administración</a>
      <button id="logout-btn" type="button">Cerrar sesión</button>
    </header>
    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Juegos disponibles</h2>
      <p id="lobby-status" role="status" aria-live="polite"></p>
      <div id="modules-container"></div>
    </section>
  </main>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
